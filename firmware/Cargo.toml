[package]
edition      = "2024"
name         = "on-air-firmware"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "on-air-firmware"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.8.0", features = [
  "dhcpv4",
  "dns",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-sync = "0.7.2"
embassy-futures = "0.1.2"
# SNTP. 0.8 is the version that pairs with embassy-net 0.8.
sntpc = { version = "0.8", default-features = false }
sntpc-net-embassy = { version = "0.8", features = ["log"] }
# TLS. 0.2 is the release built against esp-hal 1.1.
# hook-wall-clock lets mbedtls check certificate dates against our SNTP
# clock. It means building mbedtls from source; use-gcc does that with the
# ESP toolchain's Xtensa GCC, since Apple's clang can't target Xtensa.
mbedtls-rs = { version = "0.2", features = ["esp32s3", "log", "embassy-time", "hook-wall-clock", "use-gcc"] }
rand_core = "0.10.1"
heapless = "0.9"
# DHCP for phones on the setup network. 0.7 and 0.8.1 pair with embassy-net 0.8.
edge-dhcp = { version = "0.7", features = ["log"] }
edge-nal = "0.6"
edge-nal-embassy = { version = "0.8.1", default-features = false, features = ["udp", "proto-ipv4", "medium-ethernet"] }
# C library functions that mbedtls needs.
tinyrlibc = { version = "0.5", default-features = false, features = ["memchr"] }
# trail-blank-2 blanks the panel briefly after each row change, against ghosting.
esp-hub75 = { version = "0.15", features = ["esp32s3", "log", "trail-blank-2"] }
embedded-graphics = "0.8.2"
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.12.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

# Shared, host-tested crates
on-air-core = { path = "../crates/core" }
on-air-ui  = { path = "../crates/ui" }

critical-section = "1.2.0"
static_cell      = "2.1.1"


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[build-dependencies]
# Reads the WiFi name and password from the repo's .env at build time.
dotenvy = "0.15"
# Reads the refresh token the simulator saved.
serde_json = "1"
