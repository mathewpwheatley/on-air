[package]
name = "on-air-sim"
description = "Desktop simulator for the On-Air panel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
on-air-core.workspace = true
on-air-ui.workspace = true
embedded-graphics.workspace = true
embedded-graphics-simulator.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
dotenvy = "0.15"
getrandom = "0.3"
iana-time-zone = "0.1"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
