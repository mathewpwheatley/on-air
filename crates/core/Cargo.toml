[package]
name = "on-air-core"
description = "Hardware-independent On-Air logic: models, parsing, state machine, scheduling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
debouncr = "0.2"
form_urlencoded = { version = "1.2", default-features = false, features = ["alloc"] }
httparse = { version = "1.10", default-features = false }
jiff.workspace = true
libm.workspace = true
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
zune-core = { version = "0.5", default-features = false }
zune-jpeg = { version = "0.5", default-features = false }

[dev-dependencies]
rstest.workspace = true
